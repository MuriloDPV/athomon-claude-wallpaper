<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Athomon — Claude Pixel Wallpaper</title>
<meta name="description" content="Animated pixel scenes, a tiny taskbar companion and Claude FM. An independent fan wallpaper for Lively.">
<meta name="color-scheme" content="dark light">
<style>
  :root{--bg:#0a0a0b;--ink:#ece8e0;--sub:#8f8b82;--dim:#7a766e;--tela:rgba(255,255,255,.035)}
  body.claro{--bg:#e8e5db;--ink:#262422;--sub:#5d5a54;--dim:#6f6b63;--tela:rgba(0,0,0,.045)}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
  .ui{font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;color:var(--ink);pointer-events:none}

  /* hora pequena no canto */
  .brand{position:fixed;right:4.2vw;bottom:calc(3.5vh + var(--barra,48px));text-align:right;opacity:0;animation:in 2s .4s ease forwards}
  .marca{opacity:0;transition:opacity 1.4s ease;margin-bottom:1.3em}
  .marca.on{opacity:1}
  .name{font-size:12px;font-weight:500;letter-spacing:.55em;margin-right:-.55em}
  .tag{margin-top:.6em;font-size:10.5px;font-weight:300;letter-spacing:.22em;color:var(--dim)}
  .rule{width:28px;height:1px;background:var(--ink);opacity:.2;margin:1.2em 0 0 auto}
  .time{font-size:clamp(22px,1.7vw,30px);font-weight:200;letter-spacing:.02em;line-height:1}
  .date{margin-top:.55em;font-size:10.5px;font-weight:300;letter-spacing:.2em;text-transform:uppercase;color:var(--sub)}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* Claude FM: o YouTube exige o player visivel, entao ele fica pequeno no canto */
  .radio{position:fixed;left:4.2vw;top:5.5vh;opacity:0;transition:opacity 1.2s}
  .radio.on{opacity:.92}
  .radio .k{font-size:10.5px;font-weight:500;letter-spacing:.32em;color:var(--dim);margin-bottom:.8em}
  /* tela onde o Claude FM passa: um so player, que muda de lugar conforme a cena */
  #tela{position:fixed;left:0;top:0;width:0;height:0;opacity:0;pointer-events:none;overflow:hidden;border-radius:2px;
        box-shadow:0 0 34px rgba(255,255,255,.07);will-change:opacity}
  #tela iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000;
        filter:saturate(.6) contrast(1.06) brightness(.9)}
  #tela.pontos::after{content:"";position:absolute;inset:0;pointer-events:none;
        background:radial-gradient(rgba(0,0,0,0) 42%, rgba(10,10,11,.5) 78%) 0 0/3px 3px,
                   radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(0,0,0,.5) 100%)}

  #claudeNaBarra{position:fixed;inset:auto 0 0;display:block;width:100%;height:48px;
    z-index:6;pointer-events:none;image-rendering:pixelated}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="claudeNaBarra" aria-hidden="true"></canvas>

<div class="ui radio" id="radio"><div class="k">♪ CLAUDE FM</div></div>
<div id="tela"></div>
<div class="ui brand">
  <div class="marca" id="marca"><div class="name">ATHOMON</div><div class="tag">Think Higher.</div><div class="rule"></div></div>
  <div class="time" id="t">--:--</div>
  <div class="date" id="d"></div>
</div>

<script id="mascote">
/* Mascote baseado nas referencias fornecidas. Unidades em pixels do sprite.
   Trajetorias balisticas, resposta de mola amortecida e apoio das patas.
   Estado calculado pelo tempo: independente da taxa de quadros e sem acumular drift. */
(() => {
  const C={coral:'#d57a65',luz:'#dc8470',sombra:'#c5705e',olho:'#241d1b',aro:'#713e43',
    papel:'#f0ddba',capa:'#7872ad',lombada:'#51456b',fone:'#514951',metal:'#9c9190',cafe:'#6b4937'};
  const spriteBounds={w:128,h:64,x:32,y:48};
  const mod=(t,p)=>((t%p)+p)%p, clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
  const smooth=v=>{v=clamp(v);return v*v*(3-2*v)};
  const ramp=(t,a,d)=>smooth((t-a)/d);
  const pulse=(t,a,up,hold,down)=>ramp(t,a,up)-ramp(t,a+up+hold,down);
  // Solucao de x'' + 2*zeta*w*x' + w*w*x = w*w, com x(0)=x'(0)=0.
  function spring(t,w=12,z=.58){
    if(t<=0)return 0;
    const wd=w*Math.sqrt(1-z*z);
    return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+z/Math.sqrt(1-z*z)*Math.sin(wd*t));
  }
  const ring=(t,amp=.8)=>t<0?0:amp*Math.exp(-7*t)*Math.sin(16*t);
  function travel(s,t,a,b,from,to){
    const direction=Math.sign(to-from);
    if(t<a){
      if(t>=a-.18)s.heading=direction;
      return;
    }
    const progress=clamp((t-a)/(b-a));
    s.x=from+(to-from)*smooth(progress);
    if(progress>0&&progress<1){
      const length=Math.abs(to-from);
      const stride=length/Math.ceil(length/3.5);
      const distance=Math.abs(s.x-from);
      const weight=smooth(distance/.6)*smooth((length-distance)/.6);
      s.heading=direction;
      s.walk={distance,dir:direction,stride,phase:distance/stride,weight};
    }
  }
  function jump(s,t,start,v,g,base=0){
    const u=t-start,duration=2*v/g;
    if(u>=-.24&&u<0)s.compress+=1.35*Math.sin((u+.24)/.24*Math.PI/2);
    if(u>=0&&u<duration){s.y=base-v*u+.5*g*u*u;s.air=true;s.airTime=u;s.handLift=Math.sin(u/duration*Math.PI)*4;}
    if(u>=duration&&u<duration+.7)s.compress+=ring(u-duration,2);
  }

  function regar(s,t){
    travel(s,t,1.4,4.1,0,20);
    travel(s,t,14,17.2,20,0);
    s.pour=pulse(t,5.3,.65,2.3,.65);
    s.growth=pulse(t,7.2,3,8,2.8);
    s.left={x:s.x-9.5,y:-5-2.6*pulse(t,10.7,.45,1,.55)};
    s.right={x:s.x+9.7,y:-5-s.pour*5};
    s.can={x:s.right.x+1.5,y:s.right.y,tilt:s.pour};
    s.water={x:s.can.x+6,y:s.can.y-1+s.pour*.6};
    s.lean=.55*s.pour;
    s.carry=true;
  }

  function consertar(s,t){
    travel(s,t,1.6,4.1,0,16);
    travel(s,t,14.2,17,16,0);
    const contact=pulse(t,4.7,.65,3.3,.5);
    const tightening=pulse(t,5.35,.32,2.5,.38);
    const angle=-.25+.57*contact+.31*tightening*Math.sin((t-5.35)*7.6);
    const socketX=(190-124)/1.85, socketY=(100-118)/1.85;
    const gripX=socketX-8*Math.cos(angle),gripY=socketY-8*Math.sin(angle);
    s.right={x:(s.x+10)*(1-contact)+gripX*contact,y:-5*(1-contact)+gripY*contact};
    s.left={x:s.x-9.5,y:-5-2.5*pulse(t,10.2,.35,.75,.6)};
    s.tool={x:s.right.x,y:s.right.y,angle};
    s.bolt=angle*contact;
    s.power=pulse(t,9.05,.35,6.1,.5);
    s.carry=true;
  }

  function pegarTrem(s,t){
    travel(s,t,1.2,3.65,0,14);
    travel(s,t,7.2,10.9,14,45);
    travel(s,t,20,25.2,45,0);
    s.scan=pulse(t,4.4,.55,.65,.55);
    s.gate=pulse(t,5.55,.75,18.7,.75);
    s.wave=pulse(t,14,.35,3,.65);
    s.right={x:(s.x+9.5)*(1-s.scan)+24*s.scan,
      y:-5-4*s.scan-s.wave*(4+.75*Math.sin(t*11))};
    s.left={x:s.x-9.5,y:-5};
    s.carry=true;
  }

  function estado(cena,time,alerta=false){
    const periods={escritorio:24,cafe:22,leitura:20,servidores:22,estudio:26,acampamento:24,observatorio:24,
      estufa:24,oficina:23,estacao:28};
    const t=mod(time,periods[cena]||24);
    const s={t,cena,x:0,y:0,compress:0,lean:0,lookX:0,lookY:0,mode:'frente',
      left:{x:-9.5,y:-5},right:{x:9.5,y:-5},floor:0,air:false,walk:null,blink:false};
    if(cena==='escritorio'){
      s.mode='perfil';
      travel(s,t,7.8,9,0,3);travel(s,t,11,12.2,3,0);
      const typing=(1-pulse(t,6,.4,6,.5))*(1-pulse(t,17,.5,2.5,.6));
      s.tap=typing*(.5+.5*Math.sin(time*Math.PI*4));
      s.think=pulse(t,6,.5,1,.5);s.stretch=pulse(t,17,.5,1.4,.7);
      s.mouse=pulse(t,9,.5,1,.5);
      s.lookY=-s.think*1.6-s.stretch*.5;s.lookX=-s.think;
      s.lean+=s.mouse*.7-s.stretch*.45;
      s.compress=-s.stretch*.6+typing*.15*Math.sin(time*5);
      s.left={x:s.x-9.5,y:-5-s.stretch*5};
      s.right={x:s.x+9.7+s.mouse*2,y:-5.7+s.tap*1.8-s.stretch*5-s.think*4};
      s.done=pulse(t,13,.2,2,.4);
    }else if(cena==='cafe'){
      s.mode='tres-quartos';
      travel(s,t,1,2.7,0,5);travel(s,t,14,15.7,5,0);
      s.brew=pulse(t,3.1,.3,1.6,.35);s.grip=pulse(t,5.3,.6,5,.6);
      s.lift=pulse(t,6,1.1,2.8,1.35);
      s.cup={x:13-4.5*s.lift,y:-4-7*s.lift};
      const accel=(pulse(t,6,.2,.1,.5)-pulse(t,9.9,.2,.1,.5));
      s.cup.angle=accel*.12+ring(t-10.2,.06);
      s.slosh=ring(t-6.25,.6)-ring(t-10.4,.55);
      s.lean=s.lift*.8;s.compress=pulse(t,5.7,.2,.1,.3)*.8;
      const sip=pulse(t,7.4,.2,.6,.3);
      s.cup.y-=sip*.5;s.lookY=-s.lift*.6;
      s.right={x:(s.x+9.5)*(1-s.grip)+(s.cup.x+.5)*s.grip,
        y:(-5-s.brew)*(1-s.grip)+(s.cup.y+2.3)*s.grip};
      s.left={x:s.x-9.5,y:-5};
      s.content=pulse(t,11.5,.6,1.1,.7);s.blink=s.content>.6;
      s.left.y-=s.content*3;
      s.cupContact=s.lift<.001;
      s.wipe=pulse(t,17,.45,2,.45);
      s.left.x-=s.wipe*(1.4+1.2*Math.sin(t*9));
      s.left.y+=s.wipe*3.1;
    }else if(cena==='leitura'){
      s.seated=true;s.mode='frente';
      s.settle=pulse(t,1,.3,.7,.8);
      s.y=.4*s.settle+ring(t-2.1,.25);s.lean=Math.sin(time*.7)*.18;
      s.chair=.65+.45*s.settle;
      s.page=clamp((t-5)/1.45);s.pageActive=t>=5&&t<=6.9;
      s.pageAngle=Math.PI*smooth(s.page)+ring(t-6.45,.12);
      s.glasses=pulse(t,11,.55,.9,.7);
      s.lookX=Math.sin(time*.5)*.5;s.lookY=.6;
      s.left={x:-9.5+s.glasses,y:-5-s.glasses*6.2};
      const hand=pulse(t,4.65,.35,1.4,.75);
      s.right={x:10-hand*7*smooth(s.page),y:-3.7-hand*3.7};
      s.book={y:-.35*s.settle,angle:ring(t-6.45,.07)};
      s.bookmark=pulse(t,15,.55,1.1,.65);
      s.right.x-=2.1*s.bookmark;s.right.y-=2.6*s.bookmark;
    }else if(cena==='servidores'){
      s.seated=true;s.mode='costas';
      s.click=pulse(t,5,.5,.6,.45);s.ack=pulse(t,6,.25,2,.5);
      s.x=s.click*.6;s.lean=s.click*.7;
      const p=.5+.5*Math.sin(time*Math.PI*3.8);
      s.left={x:s.x-9.5,y:-9.5-p};s.right={x:9.7,y:-9.5-(1-p)-s.click*.5};
      s.chair=.4+s.click*.7;
      s.alert=alerta?pulse(t,10,.18,1,.6):0;
      s.compress=-s.alert*.8;s.left.y-=s.alert*3;s.right.y-=s.alert*3;
      s.scanScreen=pulse(t,13.1,.4,1.5,.5);
      s.left.y-=s.scanScreen*2.6;
    }else if(cena==='estudio'){
      s.mode='frente';s.x=0;
      s.lean=0;
      for(const a of [2,4.6,7.2,22])jump(s,t,a,a===7.2?13:10,40);
      if(t>=11.5&&t<12)s.x*=1-ramp(t,11.5,.5);
      s.left={x:s.x-9.5,y:s.y-5-(s.handLift||0)};s.right={x:s.x+9.5,y:s.y-5-(s.handLift||0)*.7};
      // Salto ate o degrau do mixer: y(0)=0, y(.8)=-4, g=40.
      if(t>=11.76&&t<12)s.compress=1.4*smooth((t-11.76)/.24);
      if(t>=12&&t<12.8){const u=t-12;s.x=22*u/.8;s.y=-21*u+20*u*u;s.air=true;s.left={x:s.x-9.5,y:s.y-10};s.right={x:s.x+9.5,y:s.y-8};}
      if(t>=12.8&&t<18){
        s.x=22;s.y=-4;s.floor=-4;s.compress+=ring(t-12.8,1.8);s.mode='tres-quartos';
        s.mix=pulse(t,13.4,.5,3,.5);s.fader=.5+.35*Math.sin((t-13.9)*2.5)*s.mix;
        const contact=ramp(t,13.15,.35)*(1-ramp(t,17.55,.45));
        const rest=-9-5*Math.exp(-12*(t-12.8));
        s.left={x:12.5-contact*.25,y:rest*(1-contact)+(-16.25+s.fader)*contact};
        s.right={x:31.5,y:-9-3*Math.exp(-12*(t-12.8))};s.lookX=-1;
        s.compress+=1.2*ramp(t,17.76,.24);
      }
      const back=(14+Math.sqrt(516))/40;
      if(t>=18&&t<18+back){const u=t-18;s.x=22*(1-u/back);s.y=-4-14*u+20*u*u;s.air=true;s.left={x:s.x-9.5,y:s.y-9};s.right={x:s.x+9.5,y:s.y-7};}
      if(t>=18+back&&t<20){s.compress+=ring(t-18-back,1.8);s.x*=ramp(t,18+back,.5);}
      if(!s.air&&s.floor===0&&t<11.6)s.compress+=.72*Math.max(0,Math.sin(time*Math.PI*2))**4;
      s.earLag=ring(t-2.5,.5)+ring(t-5.1,.5)+ring(t-7.85,.55)+ring(t-12.8,.5)+ring(t-18-back,.5);
    }else if(cena==='acampamento'){
      s.seated=true;s.mode='tres-quartos';
      s.inspect=pulse(t,7.4,1.4,2,1.6);
      s.blow=pulse(t,6.2,.25,.65,.4);
      s.cool=pulse(t,9,.2,.8,.3);
      s.lean=s.blow*.9;s.lookY=-s.inspect;
      s.rodAngle=-.22-.69*s.inspect+.13*pulse(t,3.5,.55,.7,.6)+ring(t-12.4,.045);
      s.rod={x:10,y:-5-s.inspect*.5};
      s.tip={x:s.rod.x+18*Math.cos(s.rodAngle),y:s.rod.y+18*Math.sin(s.rodAngle)};
      s.left={x:-9.5,y:-5};s.right={x:s.rod.x,y:s.rod.y};
      s.toast=.2+.6*pulse(t,3,2,6,1);
    }else if(cena==='observatorio'){
      s.mode='perfil';s.adjust=pulse(t,3,.65,1,.65);
      s.scopeAngle=.032*(spring(t-3.6)-spring(t-5.9));
      const a=-1.22+s.scopeAngle;
      s.ocular={x:(160-34*Math.cos(a)+2*Math.sin(a)-139)/1.4,y:(98-34*Math.sin(a)-2*Math.cos(a)-146)/1.4};
      travel(s,t,10,11.8,0,-4);travel(s,t,16,17.8,-4,0);
      s.away=pulse(t,10,1.8,4.2,1.8);
      s.point=pulse(t,12,.5,.9,.6);s.map=pulse(t,14,.5,1,.5);
      s.x+=(s.ocular.x-5)*(1-s.away);s.y=(s.ocular.y+12)*(1-s.away);
      s.lookY=-s.point*2+s.map*.8;s.lookX=-s.map*.7;
      s.left={x:s.x-9.5,y:-5};
      s.right=s.away>.9?{x:s.x+9.5,y:-5-s.point*7}:{x:s.ocular.x+3.2,y:s.ocular.y+.5};
      if(s.map>.1)s.left.y-=s.map*2;
    }else if(cena==='estufa'){
      regar(s,t);
    }else if(cena==='oficina'){
      consertar(s,t);
    }else if(cena==='estacao'){
      pegarTrem(s,t);
    }
    // Pequenos trechos de atuacao: olhar antes do gesto e repousar depois.
    s.eyeLid=0;s.turn=0;
    if(cena==='cafe'){
      s.lookX=.65*pulse(t,5,.3,4.2,.6);
      s.eyeLid=pulse(t,7.45,.15,.55,.25)*.65;
      s.cup.angle+=.15*pulse(t,7.35,.35,.55,.4);
    }else if(cena==='leitura'){
      const scan=mod(time,4)/4;
      s.lookX=scan<.85?-.45+scan/ .85*.9:.45-ramp(scan,.85,.15)*.9;
      s.lookY=.6-.5*pulse(t,4.65,.3,1.4,.6);
    }else if(cena==='servidores'){
      s.lean+=.4*pulse(t,5.7,.3,.8,.4);
    }else if(cena==='estudio'){
      const cheer=pulse(t,20,.3,.55,.45);
      s.left.y-=cheer*3.5;s.right.y-=cheer*3;
      s.eyeLid=cheer*.7;
    }else if(cena==='acampamento'){
      s.lookX=.7*s.inspect;s.eyeLid=Math.max(s.blow,s.cool)*.6;
    }
    if(s.heading)s.mode='perfil';
    if(s.walk){
      const swing=Math.sin(s.walk.phase*Math.PI*2)*s.walk.weight;
      s.y-=.65*Math.abs(swing);
      s.lean=.55*s.walk.dir*s.walk.weight;
      s.compress=0;
      s.left.y+=s.y+swing;
      s.right.y+=s.y-swing;
      if(!s.carry){s.left.x-=swing*.55;s.right.x-=swing*.55;}
      if(s.can){s.can.y=s.right.y;s.water.y=s.can.y-1+s.pour*.6;}
      if(s.tool)s.tool.y=s.right.y;
    }
    s.compress=clamp(s.compress,-.9,1.65);
    s.eyeY=clamp(s.y-12+s.compress+s.lookY,s.y-13+s.compress,s.y-9+s.compress);
    return s;
  }
  // Os pares diagonais alternam entre apoio fixo e passagem da pata.
  function pes(s){
    const bases=[-7,-3,3,7];
    return bases.map((b,i)=>{
      let x=s.x+b,y=s.floor;
      if(s.walk){
        const {stride,phase,weight:w}=s.walk;
        const p=mod(phase+[0,.5,.5,0][i],1),q=clamp((p-.58)/.42);
        x+=s.walk.dir*(-stride*(p-.5)+stride*smooth(q))*w;
        y-=Math.sin(q*Math.PI)*1.15*w;
      }else if(s.air){y=s.y-Math.sin(clamp((s.airTime||.2)/.6)*Math.PI)*.6;}
      else if(s.seated)y=s.y+.3*Math.sin(s.t*1.8+i*.7);
      return {x,y,root:s.x+b,far:i===1||i===2};
    });
  }
  window.MASCOTE={
    estado,pes,
    cenas:{athomon:'Sem mascote',escritorio:'Digita, usa o mouse e acompanha a resposta',cafe:'Prepara, pega e apoia a xicara',
      leitura:'Acomoda-se, vira paginas e ajusta os oculos',servidores:'Opera o painel e confirma os comandos',
      estudio:'Danca, salta no degrau e ajusta o mixer',acampamento:'Assa, sopra e confere o marshmallow',observatorio:'Ajusta o telescopio e consulta a carta celeste',
      estufa:'Leva o regador, rega e observa as folhas crescerem',oficina:'Aperta o parafuso e testa o aparelho',
      estacao:'Valida o cartao, atravessa a cancela e acena para o trem'},
    // Raster nativo: cada pixel do desenho ocupa um bloco inteiro na tela.
    // A fisica continua precisa; somente a pintura e quantizada para pixel art.
    desenhar(ctx,info){
      if(info.cena==='athomon')return;
      const {w,h,x:anchorX,y:anchorY}=spriteBounds;
      if(!this.camadas){
        this.camadas=['chao','ator','objetos'].map(tipo=>{
          const cv=document.createElement('canvas');cv.width=w;cv.height=h;
          return {tipo,cv,p:cv.getContext('2d')};
        });
      }
      const state=estado(info.cena,info.t||0,info.alerta);
      const fx=state.x-Math.round(state.x),fy=state.air||state.walk?state.y-Math.round(state.y):0;
      const k=info.escala||1;
      const dpr=Math.abs(ctx.getTransform().a)||1;
      ctx.save();ctx.imageSmoothingEnabled=false;
      for(const layer of this.camadas){
        const p=layer.p,dx=layer.tipo==='ator'?fx:0,dy=layer.tipo==='ator'?fy:0;
        p.setTransform(1,0,0,1,0,0);p.globalAlpha=1;p.clearRect(0,0,w,h);p.imageSmoothingEnabled=false;

    requestAnimationFrame(quadro);
    if (document.hidden || agora - ultimo < 1000 / CONFIG.fps - 2) return;
    const dt = clamp((agora - prev) / 1000, 0, .1); prev = agora; ultimo = agora;
    const t = agora / 1000;
    renderCena(ctxA, atual, t, dt, lumA, accA);
    let p = -1;
    if (trans){
      p = (t - trans.ini) / DUR;
      if (p >= 1){ atual = trans.cena; trans = null; renderCena(ctxA, atual, t, dt, lumA, accA); p = -1; }
      else { renderCena(ctxB, trans.cena, t, dt, lumB, accB); p = p * 1.06; }
    }
    pintar(p);
    if (trans) desenharMascote(p < .5 ? atual : trans.cena, Math.abs(1 - 2 * clamp(p)), t, dt);
    else desenharMascote(atual, 1, t, dt);
    if (trans) posicionarTela(p < .5 ? atual : trans.cena, Math.pow(Math.abs(1 - 2 * clamp(p)), 2));
    else posicionarTela(atual, 1);
  }
  requestAnimationFrame(quadro);

  /* ============ RELOGIO ============ */
  const tEl = document.getElementById('t'), dEl = document.getElementById('d');
  function clock(){ const n = new Date();
    tEl.textContent = n.toLocaleTimeString(LOCALE, { hour: '2-digit', minute: '2-digit', hour12: false });
    dEl.textContent = n.toLocaleDateString(LOCALE, { weekday: 'long', day: 'numeric', month: 'long' }); }
  clock(); setInterval(clock, 1000);

  /* ============ CLAUDE FM (YouTube) ============ */
  (() => {
    const cfg = CONFIG.claudeFM || {}, el = document.getElementById('radio'), tela = document.getElementById('tela');
    if (cfg.ativo === false) return;
    const params = 'autoplay=1&playsinline=1&controls=0&disablekb=1&rel=0&enablejsapi=1&hl=' + (ENGLISH ? 'en' : 'pt');
    const id = String(cfg.link || '').match(/(?:v=|youtu\.be\/|\/live\/|\/embed\/)([\w-]{11})/);
    let src = '';
    if (cfg.canal) src = `https://www.youtube.com/embed/live_stream?channel=${encodeURIComponent(cfg.canal)}&${params}`;
    else if (id) src = `https://www.youtube.com/embed/${id[1]}?${params}`;
    if (!src) return;
    const f = document.createElement('iframe');
    f.src = src; f.title = 'Claude FM'; f.allow = 'autoplay; encrypted-media'; f.referrerPolicy = 'strict-origin-when-cross-origin';
    tela.append(f); tela.classList.toggle('pontos', cfg.efeitoPontos !== false);
    FM.el = tela; FM.label = el; FM.ativo = true;
    const vol = Math.max(0, Math.min(100, Number(cfg.volume ?? 35)));
    const cmd = (func, args = []) => { try { f.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args }), 'https://www.youtube.com'); } catch (_){} };
    const tocar = () => { cmd('unMute'); cmd('setVolume', [vol]); cmd('playVideo'); };
    f.addEventListener('load', () => {
      try { f.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 'claudefm' }), 'https://www.youtube.com'); } catch (_){}
      setTimeout(tocar, 1500); setTimeout(tocar, 5000);
    });
    addEventListener('message', e => {
      if (e.origin !== 'https://www.youtube.com' || e.source !== f.contentWindow) return;
      let d; try { d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch (_){ return; }
      if (!d || typeof d !== 'object') return;
      if (d.event === 'onError'){ console.error('Claude FM: o YouTube recusou tocar aqui (erro ' + d.info + ').'); el.classList.remove('on'); FM.ativo = false; tela.style.display = 'none'; }
    });
    // se o navegador bloquear som sem interacao, o primeiro clique no wallpaper libera
    addEventListener('pointerdown', tocar, { once: true });
  })();
})();
</script>
<script id="claude-na-barra">
/* Mini-Claude desenhado na faixa visível através da barra transparente. */
(() => {
  const options = CONFIG.claudeNaBarra;
  const canvas = document.getElementById('claudeNaBarra');
  if (!options.ativo || Number(CONFIG.margemBarra) === 0) {
    canvas.style.display = 'none';
    return;
  }

  const ctx = canvas.getContext('2d');
  const sprite = document.createElement('canvas');
  sprite.width = 52;
  sprite.height = 30;
  const ink = sprite.getContext('2d');
  const colors = {
    body: '#d57a65', edge: '#c5705e', light: '#dc8470', eye: '#241d1b',
    glasses: '#713e43', paper: '#f0ddba', book: '#7872ad', spine: '#51456b',
    headset: '#514951', metal: '#9c9190', coffee: '#6b4937'
  };
  let width = 0;
  let height = 0;
  let pixelRatio = 1;
  let lastFrame = -Infinity;

  const ease = value => {
    const t = Math.max(0, Math.min(1, value));
    return t * t * (3 - 2 * t);
  };
  function gesture(time, start, up, hold, down) {
    return ease((time - start) / up) - ease((time - start - up - hold) / down);
  }
  function rect(x, y, w, h, color) {
    ink.fillStyle = colors[color] || color;
    ink.fillRect(18 + Math.round(x), 24 + Math.round(y), Math.round(w), Math.round(h));
  }
  function resize() {
    width = innerWidth;
    height = Math.max(28, Math.min(96, Number(CONFIG.margemBarra) || 48));
    pixelRatio = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * pixelRatio);
    canvas.height = Math.round(height * pixelRatio);
    canvas.style.height = height + 'px';
    ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    ctx.imageSmoothingEnabled = false;
  }

  function draw(seconds) {
    const phase = ((seconds % 40) + 40) % 40;
    const activity = phase < 5 ? 'aceno' : phase < 12 ? 'trabalho' :
      phase < 20 ? 'cafe' : phase < 29 ? 'leitura' : 'musica';
    const blink = seconds % 6.7 > 6.57;
    const wave = activity === 'aceno' ? gesture(phase, .8, .4, 1.8, .5) : 0;
    const sip = activity === 'cafe' ? gesture(phase, 14, 1.1, 1.8, 1.1) : 0;
    const beat = activity === 'musica' ? (1 - Math.cos(seconds * Math.PI * 1.05)) / 2 : 0;
    const propOpacity = activity === 'trabalho' ? gesture(phase, 5, .35, 6.3, .35) :
      activity === 'cafe' ? gesture(phase, 12, .35, 7.3, .35) :
      activity === 'leitura' ? gesture(phase, 20, .35, 8.3, .35) :
      activity === 'musica' ? gesture(phase, 29, .35, 10.3, .35) : 1;

    ink.clearRect(0, 0, sprite.width, sprite.height);
    // Mesmo corpo compacto e mesmos olhos em todas as atividades.
    rect(-8, -14, 16, 12, 'body');
    rect(-8, -13, 1, 10, 'edge');
    rect(-7, -14, 4, 1, 'light');
    for (const x of [-8, -4, 2, 6]) rect(x, -2, 2, 2, 'body');
    rect(-11, -7 - Math.round(beat), 3, 3, 'body');
    rect(8, -7 - Math.round(4 * wave) - Math.round(beat), 3, 3, 'body');
    rect(-5, blink ? -11 : -12, 2, blink ? 1 : 2, 'eye');
    rect(5, blink ? -11 : -12, 2, blink ? 1 : 2, 'eye');

    ink.save();
    ink.globalAlpha = propOpacity;
    if (activity === 'trabalho') {
      rect(5, -2, 14, 2, 'metal');
      for (let i = 0; i < 5; i++) rect(7 + 2 * i, -2, 1, 1, '#625855');
      const tap = Math.floor(seconds * 4) % 2;
      rect(6, -4 - tap, 3, 2, 'body');
      rect(11, -5 + tap, 3, 2, 'body');
    } else if (activity === 'cafe') {
      const x = 11 - Math.round(sip * 3);
      const y = -4 - Math.round(sip * 6);
      rect(8, -6 - Math.round(sip * 3), 3, 3, 'body');
      rect(x, y, 5, 4, 'paper');
      rect(x + 1, y, 3, 1, 'coffee');
      rect(x + 5, y + 1, 2, 1, 'paper');
      rect(x + 6, y + 2, 1, 1, 'paper');
      rect(x + 5, y + 3, 2, 1, 'paper');
      for (let i = 0; i < 2; i++) {
        const rise = (seconds * .45 + i * .5) % 1;
        ink.globalAlpha = propOpacity * (1 - rise) * .55;
        rect(x + 1 + i * 2, y - 1 - Math.floor(rise * 4), 1, 1, 'paper');
      }
    } else if (activity === 'leitura') {
      for (const [x, w] of [[-6, 6], [3, 5]]) {
        rect(x, -13, w, 1, 'glasses');
        rect(x, -8, w, 1, 'glasses');
        rect(x, -12, 1, 4, 'glasses');
        rect(x + w - 1, -12, 1, 4, 'glasses');
      }
      rect(0, -12, 3, 1, 'glasses');
      rect(0, -6, 9, 6, 'spine');
      rect(1, -5, 3, 5, 'book');
      rect(5, -6, 4, 5, 'book');
      rect(1, -6, 3, 1, 'paper');
      rect(4, -7, 5, 1, 'paper');
      rect(4, -5, 1, 5, '#b39bc4');
      const turn = gesture(phase, 24, .8, .1, .6);
      if (turn > .05) rect(8 - Math.round(turn * 7), -7, 1, 5, 'paper');
    } else if (activity === 'musica') {
      rect(-7, -17, 14, 1, 'headset');
      rect(-9, -16, 2, 1, 'headset');
      rect(7, -16, 2, 1, 'headset');
      rect(-10, -15, 1, 4, 'headset');
      rect(9, -15, 1, 4, 'headset');
      rect(-11, -11, 3, 4, 'headset');
      rect(8, -11, 3, 4, 'headset');
      rect(-10, -10, 1, 2, 'metal');
      rect(9, -10, 1, 2, 'metal');
    }
    ink.restore();

    ctx.clearRect(0, 0, width, height);
    const scale = Math.max(1, Math.min(Number(options.tamanho) || 2, Math.floor((height - 8) / 18)));
    const center = Math.max(56, Math.min(Number(options.x) || 220, width - 64));
    const baseline = height - 6;
    ctx.globalAlpha = .23;
    ctx.fillStyle = CONFIG.tema === 'claro' ? '#302925' : '#b4a69c';
    ctx.fillRect(center - 30, baseline + 1, 76, 1);
    ctx.globalAlpha = 1;
    ctx.drawImage(sprite, center - 18 * scale, baseline - 24 * scale, sprite.width * scale, sprite.height * scale);
    canvas.dataset.atividade = activity;
  }

  function animateTaskbar(now) {
    requestAnimationFrame(animateTaskbar);
    if (now - lastFrame < 1000 / 24 - 1) return;
    lastFrame = now;
    draw(now / 1000);
  }
  window.CLAUDE_NA_BARRA = { desenhar: draw };
  addEventListener('resize', resize);
  resize();
  draw(0);
  requestAnimationFrame(animateTaskbar);
})();

</script>
